<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeHub - Download Top Trending Blank Meme Templates</title>
    
    <!-- Google AdSense Script -->
    <script async src="https://pagead2.yndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5926136240372749" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #111827;
            --accent-orange: #ff9900;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding-top: 80px; line-height: 1.6; }
        
        /* Navbar & Pinterest Hub Logo Style */
        nav { 
            position: fixed; top: 0; left: 0; width: 100%; 
            background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 16px 30px; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.4); 
        }
        .logo { font-size: 24px; font-weight: 800; text-decoration: none; color: white; display: flex; align-items: center; }
        .logo .hub-badge { background-color: var(--accent-orange); color: #000; padding: 2px 8px; border-radius: 6px; margin-left: 2px; }
        
        .nav-links { display: flex; gap: 25px; list-style: none; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-orange); }
        .hamburger { display: none; cursor: pointer; font-size: 26px; color: var(--accent-orange); background: none; border: none; }

        /* Container & Hero */
        .container { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
        .hero { text-align: center; margin-bottom: 30px; }
        .hero h1 { color: var(--text-main); font-size: 32px; font-weight: 800; margin-bottom: 10px; }
        .hero p { color: var(--text-muted); font-size: 15px; }

        /* Search Bar */
        .search-container { max-width: 600px; margin: 0 auto 35px auto; }
        .search-input { 
            width: 100%; padding: 14px 20px; background: var(--bg-secondary); 
            border: 1px solid var(--border); color: var(--text-main); 
            border-radius: 12px; font-size: 15px; outline: none; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .search-input:focus { border-color: var(--accent-orange); box-shadow: 0 4px 20px rgba(255, 153, 0, 0.2); }

        /* Pinterest Style Masonry Grid */
        .pinterest-grid {
            column-count: 4;
            column-gap: 20px;
        }
        @media (max-width: 1200px) { .pinterest-grid { column-count: 3; } }
        @media (max-width: 800px) { .pinterest-grid { column-count: 2; } }
        @media (max-width: 500px) { .pinterest-grid { column-count: 1; } }

        .meme-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 20px;
            break-inside: avoid;
            transition: 0.3s;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .meme-card:hover { transform: translateY(-4px); border-color: var(--accent-orange); }

        .meme-img { width: 100%; height: auto; display: block; border-bottom: 1px solid var(--border); }
        .meme-info { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
        .meme-title { font-size: 14px; font-weight: 600; color: var(--text-main); }
        
        .download-btn { 
            display: block; width: 100%; background: var(--accent-orange); color: #000; 
            text-align: center; padding: 9px; border-radius: 8px; font-weight: 700; 
            text-decoration: none; font-size: 13px; transition: 0.3s; 
        }
        .download-btn:hover { background: #e68a00; box-shadow: 0 4px 12px rgba(255, 153, 0, 0.3); }

        /* Footer */
        footer { 
            text-align: center; margin-top: 60px; padding: 30px 0; 
            border-top: 1px solid var(--border); color: var(--text-muted); font-size: 13px; 
            background: var(--bg-secondary);
        }
        footer .footer-links { margin-top: 12px; display: flex; justify-content: center; gap: 20px; }
        footer a { color: var(--accent-orange); text-decoration: none; }
        footer a:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .nav-links { 
                display: none; flex-direction: column; position: absolute; 
                top: 70px; left: 0; width: 100%; background: var(--bg-secondary); 
                padding: 20px; border-bottom: 1px solid var(--border); gap: 15px; align-items: flex-start;
                box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            }
            .nav-links.active { display: flex; }
            .hamburger { display: block; }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <a href="index.html" class="logo">Meme<span class="hub-badge">Hub</span></a>
        <button class="hamburger" onclick="toggleMenu()">☰</button>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="privacy.html">Privacy Policy</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>

<div class="container">
    <header class="hero">
        <h1>Explore & Download <span>Best Memes</span></h1>
        <p>The ultimate Pinterest-style repository for high-quality blank meme templates.</p>
    </header>

    <!-- Search Input -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search among thousands of memes..." onkeyup="filterMemes()">
    </div>

    <!-- Pinterest Masonry Grid -->
    <div class="pinterest-grid" id="memeGrid">
        <!-- Memes will be loaded dynamically via JavaScript for clean performance -->
    </div>
</div>

<footer>
    <p>&copy; 2026 MemeHub. All rights reserved.</p>
    <div class="footer-links">
        <a href="privacy.html">Privacy Policy</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
    </div>
</footer>

<script>
    // Hamburger Menu Toggle
    function toggleMenu() {
        document.getElementById('navLinks').classList.toggle('active');
    }

    // Meme Database (Starter set of top trending templates)
    const memeDatabase = [
        { title: "Drake Hotline Bling", url: "https://i.imgflip.com/30b1gx.jpg" },
        { title: "Distracted Boyfriend", url: "https://i.imgflip.com/1ur9b0.jpg" },
        { title: "Change My Mind", url: "https://i.imgflip.com/24y43o.jpg" },
        { title: "Two Buttons", url: "https://i.imgflip.com/1g8my4.jpg" },
        { title: "Expanding Brain", url: "https://i.imgflip.com/1jwhww.jpg" },
        { title: "Buff Doge vs Cheems", url: "https://i.imgflip.com/41vzbx.png" },
        { title: "This Is Fine", url: "https://i.imgflip.com/wxica.jpg" },
        { title: "Monkey Puppet", url: "https://i.imgflip.com/2gnnjh.jpg" },
        { title: "Disaster Girl", url: "https://i.imgflip.com/23ls.jpg" },
        { title: "Woman Yelling at Cat", url: "https://i.imgflip.com/345v97.jpg" },
        { title: "Boardroom Meeting Suggestion", url: "https://i.imgflip.com/m78d.jpg" },
        { title: "Hide the Pain Harold", url: "https://i.imgflip.com/gk5el.jpg" },
        { title: "Left Exit 12 Off Ramp", url: "https://i.imgflip.com/22bdq6.jpg" },
        { title: "SpongeBob Mocking", url: "https://i.imgflip.com/1otk96.jpg" },
        { title: "Galaxy Brain", url: "https://i.imgflip.com/1wz1x.jpg" }
    ];

    // Render Memes Function
    function renderMemes(memesToRender) {
        const grid = document.getElementById('memeGrid');
        grid.innerHTML = "";

        if(memesToRender.length === 0) {
            grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No memes found matching your search!</p>`;
            return;
        }

        memesToRender.forEach(meme => {
            const card = document.createElement('div');
            card.className = 'meme-card';
            card.innerHTML = `
                <img src="${meme.url}" alt="${meme.title}" class="meme-img" loading="lazy">
                <div class="meme-info">
                    <div class="meme-title">${meme.title}</div>
                    <a href="${meme.url}" target="_blank" download class="download-btn">Download HD</a>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // Live Filter Logic
    function filterMemes() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = memeDatabase.filter(m => m.title.toLowerCase().includes(query));
        renderMemes(filtered);
    }

    // Initial Load
    window.onload = function() {
        renderMemes(memeDatabase);
    }
</script>

</body>
</html>
