<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboVerse - Free Image Converter & Resizer</title>
    
    <!-- Google AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5926136240372749" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { text-align: center; margin-bottom: 10px; color: #38bdf8; font-size: 24px; }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 25px; font-size: 14px; }
        .upload-box { border: 2px dashed #475569; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; cursor: pointer; transition: 0.3s; }
        .upload-box:hover { border-color: #38bdf8; background: #0f172a; }
        input[type="file"] { display: none; }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .control-group { flex: 1; min-width: 200px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #cbd5e1; }
        select, input[type="number"] { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; }
        button { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0369a1; }
        .result { margin-top: 25px; text-align: center; }
        .result img { max-width: 100%; max-height: 200px; border-radius: 6px; margin-top: 10px; border: 1px solid #475569; }
        .download-btn { display: inline-block; margin-top: 15px; background: #22c55e; color: white; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; }
        .download-btn:hover { background: #16a34a; }
    </style>
</head>
<body>

<div class="container">
    <h1>Image Converter & Resizer</h1>
    <p class="subtitle">Convert PNG/JPG to WebP/JPG and resize instantly in your browser!</p>

    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <p>📁 Click here to select an image</p>
        <input type="file" id="fileInput" accept="image/*" onchange="handleImage(event)">
    </div>

    <div id="editorSection" style="display:none;">
        <div class="controls">
            <div class="control-group">
                <label>Convert Format:</label>
                <select id="formatSelect">
                    <option value="image/jpeg">JPG</option>
                    <option value="image/png">PNG</option>
                    <option value="image/webp">WebP</option>
                </select>
            </div>
            <div class="control-group">
                <label>Resize Width (px):</label>
                <input type="number" id="widthInput" placeholder="Keep original">
            </div>
        </div>

        <button onclick="processImage()">Process & Convert</button>
    </div>

    <div class="result" id="resultSection"></div>
</div>

<script>
    let uploadedImage = null;

    function handleImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            uploadedImage = new Image();
            uploadedImage.onload = function() {
                document.getElementById('editorSection').style.display = 'block';
                document.getElementById('widthInput').value = uploadedImage.width;
            }
            uploadedImage.src = e.target.result;
        }
        reader.readAsDataURL(file);
    }

    function processImage() {
        if (!uploadedImage) return;

        let targetWidth = parseInt(document.getElementById('widthInput').value) || uploadedImage.width;
        let scaleFactor = targetWidth / uploadedImage.width;
        let targetHeight = Math.round(uploadedImage.height * scaleFactor);

        let canvas = document.createElement('canvas');
        canvas.width = targetWidth;
        canvas.height = targetHeight;
        let ctx = canvas.getContext('2d');
        ctx.drawImage(uploadedImage, 0, 0, targetWidth, targetHeight);

        let format = document.getElementById('formatSelect').value;
        let dataUrl = canvas.toDataURL(format, 0.9);

        let ext = format.split('/')[1];
        if(ext === 'jpeg') ext = 'jpg';

        let resultSection = document.getElementById('resultSection');
        resultSection.innerHTML = `
            <p style="color: #38bdf8;">Processed Successfully!</p>
            <img src="${dataUrl}" alt="Converted Image">
            <br>
            <a href="${dataUrl}" download="converted-image.${ext}" class="download-btn">Download Image</a>
        `;
    }
</script>

</body>
</html>
